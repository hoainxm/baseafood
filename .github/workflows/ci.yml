# Cổng chất lượng tự động — chạy trên GitHub Actions mỗi lần push/PR vào main.
# Bổ sung cho .githooks/pre-commit (chạy trên máy 1 người): CI bắt được lỗi trên
# MỌI commit, mọi máy — kể cả khi ai đó commit --no-verify hay quên bật hooksPath.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Kiểm kiểu + build (tsc -b && vite build)
        run: npm run build

      - name: Test (vitest)
        run: npm test
